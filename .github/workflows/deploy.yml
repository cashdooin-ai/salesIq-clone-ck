# GitHub Actions - Auto Deploy on Push
# Deploys to your server when you push to main branch

name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================
  # BUILD & PUSH IMAGES
  # ===================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Widget
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.widget
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/widget:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================
  # DEPLOY TO SERVER
  # ===================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexvo

            # Pull latest images from GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/widget:latest

            # Update and restart
            cd deploy
            docker compose -f docker-compose.prod.yml up -d --force-recreate api web widget

            # Cleanup
            docker image prune -f

            echo "✓ Deployment complete!"

      - name: Notify success
        if: success()
        run: echo "🚀 Deployment successful!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed!"
