version: '3.8'

# Production Docker Compose for Nexvo
# Single-server deployment (good for 1-100 clients)

services:
  # ===================
  # REVERSE PROXY
  # ===================
  traefik:
    image: traefik:v3.0
    container_name: nexvo-traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - nexvo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"

  # ===================
  # DATABASE
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: nexvo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-nexvo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nexvo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - nexvo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexvo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # CACHE & PUBSUB
  # ===================
  redis:
    image: redis:7-alpine
    container_name: nexvo-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - nexvo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # API SERVER
  # ===================
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: nexvo-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-nexvo}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nexvo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # URLs
      API_URL: https://api.${DOMAIN}
      WEB_URL: https://app.${DOMAIN}
      WIDGET_URL: https://widget.${DOMAIN}
      CORS_ORIGINS: https://app.${DOMAIN},https://${DOMAIN}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Storage (Cloudflare R2)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: auto
      # Payment Gateways
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexvo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  # ===================
  # WEB DASHBOARD
  # ===================
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_SOCKET_URL: https://api.${DOMAIN}
    container_name: nexvo-web
    restart: always
    networks:
      - nexvo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # ===================
  # CHAT WIDGET (CDN)
  # ===================
  widget:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.widget
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_SOCKET_URL: https://api.${DOMAIN}
    container_name: nexvo-widget
    restart: always
    networks:
      - nexvo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.widget.rule=Host(`widget.${DOMAIN}`)"
      - "traefik.http.routers.widget.entrypoints=websecure"
      - "traefik.http.routers.widget.tls.certresolver=letsencrypt"
      - "traefik.http.services.widget.loadbalancer.server.port=80"
      # Cache static assets
      - "traefik.http.middlewares.widget-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000"

  # ===================
  # BACKGROUND JOBS
  # ===================
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: nexvo-worker
    restart: always
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-nexvo}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nexvo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      - postgres
      - redis
    networks:
      - nexvo-network

  # ===================
  # DATABASE BACKUP
  # ===================
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: nexvo-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-nexvo}
      POSTGRES_USER: ${DB_USER:-nexvo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    networks:
      - nexvo-network

volumes:
  postgres-data:
  redis-data:
  traefik-certs:

networks:
  nexvo-network:
    driver: bridge
